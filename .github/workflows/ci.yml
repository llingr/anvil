name: CI

on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  build:
    name: build & vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # the library and the example service, each its own module
      - run: make build
      - name: Windows build and vet, tests included
        run: |
          GOOS=windows go vet ./...
          (cd example && GOOS=windows go vet ./...)
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy -diff
          (cd example && go mod tidy -diff)

  test:
    name: test (race + coverage)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # coverpkg reaches the external test packages, tests/ among them
      - name: Tests
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -5
